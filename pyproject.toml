[project]
name = "nodenexus"
version = "0.1.0"
description = "Remote server management tool"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncssh>=2.24.0",
    "dishka>=1.10.1",
]

[project.scripts]
nodenexus = "main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.20",
]
