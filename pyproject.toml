[project]
name = "nodenexus"
version = "0.1.0"
description = "Remote server management tool"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncssh>=2.14.0",
    "dishka>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
nodenexus = "nodenexus.main:main"
